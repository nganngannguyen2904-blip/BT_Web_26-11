# ===================================================================
# ACCOUNT HUB - ACCOUNT MANAGEMENT SYSTEM
# Configuration Properties
# ===================================================================

# Server Configuration
server.port=8090
server.servlet.context-path=
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Application Name
spring.application.name=Account Management System

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/static/**

# Database Configuration (H2 file-based in MySQL mode as persistent fallback):
spring.datasource.url=${DB_URL:jdbc:h2:file:./database/account_hub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.accounthub=INFO
logging.level.org.springframework.security=INFO
