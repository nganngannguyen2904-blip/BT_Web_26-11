<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - ACCOUNT HUB</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card text-center" style="max-width: 480px;">
            <div class="brand-logo-icon bg-danger text-white mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                <i class="bi bi-shield-x"></i>
            </div>
            <h2 class="fw-bold mb-2 text-danger">Có Lỗi Xảy Ra</h2>
            <p class="text-muted mb-4">
                Trang bạn đang cố gắng truy cập không tồn tại hoặc bạn không có quyền truy cập. Vui lòng đăng nhập hoặc quay lại trang chủ.
            </p>

            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/login}" class="btn btn-primary-gradient" style="width: auto;">
                    <i class="bi bi-box-arrow-in-right"></i> Về trang Đăng nhập
                </a>
                <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                    <i class="bi bi-house-door"></i> Về Dashboard
                </a>
            </div>
        </div>
    </div>
</body>
</html>
