# ===================================================================
# MySQL Production Profile
# Kích hoạt khi chạy với: --spring.profiles.active=mysql
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/account_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
